<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GreenPulse AI — Renewable Energy Operations</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* =========================================================
         GREENPULSE AI — SPLASH SCREEN
         ========================================================= */

      #gp-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #081c15;

        padding: 40px 24px;
        box-sizing: border-box;

        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }

      #gp-splash.gp-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* =========================================================
         LOGO
         ========================================================= */

      .gp-splash-logo {
        width: min(620px, 82vw);
        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 42px;
      }

      .gp-splash-icon {
        display: block;

        width: 100%;
        height: auto;

        max-height: 230px;

        object-fit: contain;

        /* Prevents accidental oversized rendering */
        flex-shrink: 0;
      }

      /* =========================================================
         TAGLINE
         ========================================================= */

      .gp-splash-tagline {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;

        font-size: 13px;
        font-weight: 400;

        color: rgba(255, 255, 255, 0.45);

        margin-bottom: 42px;

        letter-spacing: 0.02em;

        text-align: center;
      }

      /* =========================================================
         PROGRESS BAR
         ========================================================= */

      .gp-splash-bar-track {
        width: 240px;
        max-width: 70vw;

        height: 3px;

        background: rgba(255, 255, 255, 0.1);

        border-radius: 3px;

        overflow: hidden;

        margin-bottom: 18px;
      }

      .gp-splash-bar-fill {
        height: 100%;
        width: 0%;

        background: linear-gradient(
          90deg,
          #147d64,
          #22a06b,
          #f5b942
        );

        border-radius: 3px;

        animation:
          gp-bar 2.4s
          cubic-bezier(0.4, 0, 0.2, 1)
          forwards;
      }

      @keyframes gp-bar {
        0% {
          width: 0%;
        }

        40% {
          width: 55%;
        }

        70% {
          width: 75%;
        }

        90% {
          width: 88%;
        }

        100% {
          width: 100%;
        }
      }

      /* =========================================================
         STATUS
         ========================================================= */

      .gp-splash-status {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;

        font-size: 11px;

        color: rgba(255, 255, 255, 0.35);

        letter-spacing: 0.08em;

        height: 16px;

        text-align: center;
      }

      /* =========================================================
         LOADING DOTS
         ========================================================= */

      .gp-splash-dots {
        display: flex;

        gap: 6px;

        margin-top: 28px;
      }

      .gp-splash-dots span {
        width: 5px;
        height: 5px;

        border-radius: 50%;

        background: #147d64;

        animation:
          gp-dot 1.2s
          ease-in-out
          infinite;
      }

      .gp-splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .gp-splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes gp-dot {
        0%,
        80%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }

        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* =========================================================
         IBM BADGE
         ========================================================= */

      .gp-splash-ibm {
        position: absolute;

        bottom: 28px;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;

        font-size: 10px;

        color: rgba(255, 255, 255, 0.22);

        letter-spacing: 0.12em;

        text-transform: uppercase;

        text-align: center;
      }

      /* =========================================================
         MOBILE
         ========================================================= */

      @media (max-width: 600px) {
        #gp-splash {
          padding: 30px 18px;
        }

        .gp-splash-logo {
          width: 90vw;
          max-width: 480px;

          margin-bottom: 32px;
        }

        .gp-splash-icon {
          max-height: 180px;
        }

        .gp-splash-tagline {
          font-size: 11px;
          margin-bottom: 34px;
        }

        .gp-splash-ibm {
          bottom: 20px;
          font-size: 8px;
        }
      }
    </style>
  </head>

  <body>

    <!-- =====================================================
         GREENPULSE AI SPLASH
         ===================================================== -->

    <div
      id="gp-splash"
      role="status"
      aria-label="GreenPulse AI loading"
    >

      <!-- Logo -->
      <div class="gp-splash-logo">
        <img
          src="/logo.png"
          alt="GreenPulse AI"
          class="gp-splash-icon"
        />
      </div>

      <!-- Tagline -->
      <div class="gp-splash-tagline">
        Smart Renewable Energy Operations · Kutch &amp; Banaskantha
      </div>

      <!-- Progress -->
      <div class="gp-splash-bar-track">
        <div class="gp-splash-bar-fill"></div>
      </div>

      <!-- Status -->
      <div
        class="gp-splash-status"
        id="gp-splash-status"
      >
        Initialising systems…
      </div>

      <!-- Dots -->
      <div class="gp-splash-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- IBM -->
      <div class="gp-splash-ibm">
        Powered by Fernando Mugiba <br>
        Using IBM Cloud · watsonx.ai
      </div>

    </div>

    <!-- React -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
